name: Generate Cheat Sheets
on:
  workflow_dispatch:
jobs:
  generate:
    strategy:
      matrix:
        module: [frontend, backend, mobile, ai]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure git identity
        run: |
          git config user.name "farang-dev"
          git config user.email "farang-dev@users.noreply.github.com"
      - name: Run OpenCode - generate ${{ matrix.module }} cheat sheets
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          use_github_token: true
          prompt: |
            You are an expert software engineering educator. Your task is to generate cheat sheets for ONLY the cheat-${{ matrix.module }} module in src/data/curriculum.ts. Do NOT touch any other module or domain.

            ## Context
            The module id is "cheat-${{ matrix.module }}". It contains ${{ matrix.module == 'frontend' && '15' || matrix.module == 'backend' && '15' || matrix.module == 'mobile' && '7' || '14' }} topics. Every topic currently has content: "// Content coming soon". Replace each one with a complete, exhaustive cheat sheet.

            ## Structure for EVERY topic (MUST follow):
            - ## Quick Reference (3-5 line summary)
            - ## Language Fundamentals (if a language is covered): Types & Values table, Variables, Control Flow, Functions, Types/Generics, Concurrency/Async, Module System, Standard Library highlights
            - ## Framework by Framework Reference: For EACH framework — Setup, Core Concepts, Common Patterns
            - ## Comparison Tables: frameworks side by side
            - ## Common Pitfalls & Anti-patterns (at least 10)
            - ## Complete API Reference (comprehensive table)
            - ## Practice Questions (at least 8)

            ## RULES
            1. Zero omissions — complete reference, not an overview.
            2. Heavy use of tables.
            3. Every code block must have line-by-line comments.
            4. Use <code> tags for inline code (NOT backticks).
            5. Escape dollar-brace as backslash-dollar-brace inside template literals.
            6. Preserve id, title, shortDesc, difficulty, readTimeMin, keyPoints, tags — ONLY replace content.
            7. After ALL edits, run: npx tsc -p tsconfig.app.json --noEmit — fix any errors.
            8. Write in English, no emojis.
            9. readTimeMin must stay at 5.

  dispatch-intros:
    if: success()
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch add-intro-sections workflow
        run: |
          gh workflow run add-intro-sections.yml --repo farang-dev/dev-edu
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
