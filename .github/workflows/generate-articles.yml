name: Generate Articles
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure git identity
        run: |
          git config user.name "farang-dev"
          git config user.email "farang-dev@users.noreply.github.com"
      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          use_github_token: true
          prompt: |
            You are an expert software engineering educator. Your task is to generate master-level educational articles in src/data/curriculum.ts.

            ## Context
            The file is a TypeScript file containing a curriculum with 118 topics across 4 domains:
            - be-* (Backend, 34 topics — all placeholders: `content: "// Content coming soon"`)
            - infra-* (Infrastructure, 22 topics — all placeholders)
            - do-* (DevOps, 26 topics — all placeholders)
            - fe-* (Frontend, 36 topics — have existing short content that needs to be rewritten to master quality)

            ## What to do
            1. First, read these 3 reference articles to understand the format and quality bar:
               - fe-crp: "The Critical Rendering Path" (around line 73)
               - fe-v8: "V8 Engine: JIT Compilation & Garbage Collection" (around line 661)
               - fe-event-loop: "The Event Loop, Tasks & Microtasks" (around line 1113)

            2. Process ALL 4 domains in this EXACT order. Do NOT skip any, do NOT reorder:
               - FIRST: be-* (Backend) — replace all placeholders
               - SECOND: infra-* (Infrastructure) — replace all placeholders
               - THIRD: do-* (DevOps) — replace all placeholders
               - FOURTH: fe-* (Frontend) — rewrite existing content to master quality

            Within each domain, work through topics in curriculum.ts order.

            ## Quality Requirements (CRITICAL)
            Each article must be **master-level** — a bootcamp student reading it should fully understand the topic afterward:

            ### Structure (every article)
            - "## Why This Matters (Read This First)" — A compelling real-world analogy or hook
            - Multiple ## and ### sections covering every keyPoint listed in the topic definition
            - Each concept: definition → why it exists → how it works → real-world example
            - Comprehensive, working code examples with line-by-line explanation
            - ASCII architecture diagrams where helpful (inside code fences)
            - Comparison tables when contrasting technologies/approaches
            - "## Practice Questions" — exactly 5 Q&A pairs testing DEEP understanding (prefer scenario-based questions)
            - "## Summary Cheat Sheet" in a code block

            ### Depth
            - Cover the "why" behind every concept, not just the "what"
            - Include edge cases, common pitfalls, and production considerations
            - Add performance implications and trade-offs
            - Reference real-world technologies and frameworks by name
            - Include configuration examples, CLI commands, and debugging tips

            ### Code examples
            - Every code block must have a real, runnable example
            - Explain what each line/block does in plain English
            - Show both the right way AND common mistakes

            ## Important rules
            - Work through topics in curriculum.ts order within each domain
            - After all edits from all 4 domains, verify: run `npx tsc --noEmit` — fix any errors
            - Do NOT create any new files — only edit curriculum.ts
            - Write in English, no emojis
