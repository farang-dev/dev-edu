name: Generate Articles
on:
  workflow_dispatch:
    inputs:
      domain:
        description: Domain to process
        required: true
        default: backend
        type: choice
        options:
          - frontend
          - backend
          - infrastructure
          - devops
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure git identity
        run: |
          git config user.name "farang-dev"
          git config user.email "farang-dev@users.noreply.github.com"
      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          use_github_token: true
          prompt: |
            You are an expert software engineering educator. Your task is to generate master-level educational articles in src/data/curriculum.ts.

            ## Context
            The file is a TypeScript file containing a curriculum with 118 topics across 4 domains:
            - fe-* (Frontend, 36 topics — all have content already but need improvement)
            - be-* (Backend, 34 topics — most have placeholder content)
            - infra-* (Infrastructure, 22 topics — all placeholders)
            - do-* (DevOps, 26 topics — all placeholders)

            ## What to do
            1. First, read these 3 reference articles to understand the format:
               - fe-crp (around line 73): "The Critical Rendering Path"
               - fe-v8 (around line 661): "V8 Engine: JIT Compilation & Garbage Collection"
               - fe-event-loop (around line 1113): "The Event Loop, Tasks & Microtasks"

            2. Process ONLY the "${{ github.event.inputs.domain }}" domain:
                - If "frontend": Rewrite ALL 36 existing fe-* articles to master quality. Existing content is short — use it as reference but expand each article substantially to match the same depth as backend/infra/devops articles.
               - If "backend": Replace ALL be-* placeholders with master-quality articles
               - If "infrastructure": Replace ALL infra-* placeholders with master-quality articles
               - If "devops": Replace ALL do-* placeholders with master-quality articles

            ## Quality Requirements (CRITICAL)
            Each article must be **master-level** — a bootcamp student reading it should fully understand the topic afterward:

            ### Structure (every article)
            - "## Why This Matters (Read This First)" — A compelling real-world analogy or hook that makes the reader immediately see why this topic is important
            - Multiple ## and ### sections covering every keyPoint listed in the topic definition
            - Each concept must include: definition → why it exists → how it works → real-world example
            - Comprehensive, working code examples with line-by-line explanation
            - ASCII architecture diagrams where helpful (inside code fences)
            - Comparison tables when contrasting technologies/approaches
            - "## Practice Questions" — exactly 5 Q&A pairs that test DEEP UNDERSTANDING, not recall. Include scenario-based questions.
            - "## Summary Cheat Sheet" in a code block (key commands, patterns, and gotchas)

            ### Depth
            - Cover the "why" behind every concept, not just the "what"
            - Include edge cases, common pitfalls, and production considerations
            - Add performance implications and trade-offs
            - Reference real-world technologies and frameworks by name
            - Include configuration examples, CLI commands, and debugging tips

            ### Code examples
            - Every code block must have a real, runnable example
            - Explain what each line/block does in plain English
            - Show both the right way AND common mistakes

            ## Important rules
            - Work through topics in curriculum.ts order
            - After all edits, verify: run `npx tsc --noEmit` — fix any errors
            - Do NOT create any new files — only edit curriculum.ts
            - Write in English, no emojis
