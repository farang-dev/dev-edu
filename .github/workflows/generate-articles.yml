name: Generate Articles

on:
  workflow_dispatch:
    inputs:
      batch_count:
        description: 'Generate this many articles (1-10, or 0 for as many as possible)'
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '3'
          - '5'
          - '10'
          - '0'

  schedule:
    - cron: '0 6 * * 1'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          prompt: |
            You are working in the Dev-Edu project at src/data/curriculum.ts.

            There are 82 topics with placeholder content (`content: "// Content coming soon"`).
            Your job is to generate full educational articles for them.

            ## Reference style (3 completed articles already in the file):
            - fe-crp: "The Critical Rendering Path"
            - fe-v8: "V8 Engine: JIT Compilation & Garbage Collection"
            - fe-event-loop: "The Event Loop, Tasks & Microtasks"

            Read these 3 articles to understand the writing style, then:

            1. Find topics with `content: "// Content coming soon"`
            2. For each, generate a full article matching the reference style:
               - Start with "## Why This Matters (Read This First)" — relatable hook/analogy
               - Use ## and ### headers
               - Include code examples, tables, ASCII diagrams where relevant
               - End with "## Practice Questions" (exactly 5 Q&A pairs)
               - End with "## Summary Cheat Sheet" in a code block
               - Write in English, no emojis
            3. Replace the placeholder content in curriculum.ts

            Generate at most ${{ github.event.inputs.batch_count || '3' }} articles per run.
            If batch_count is 0, generate as many as you can in one session.
            Work through topics in order (be-nodejs first, then be-go-scheduler, etc.).

            After generating, verify the file still compiles with `npx tsc --noEmit`.
            Do NOT create any new files — only edit curriculum.ts.
