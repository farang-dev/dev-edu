name: Generate Nutshell Content
on:
  workflow_dispatch:
jobs:
  generate:
    strategy:
      matrix:
        batch:
          - name: python-js
            modules: nutshell-python,nutshell-javascript
            count: 24
          - name: ts-go
            modules: nutshell-typescript,nutshell-go
            count: 20
          - name: rust-java
            modules: nutshell-rust,nutshell-java
            count: 20
          - name: html-sql
            modules: nutshell-html-css,nutshell-sql
            count: 20
          - name: cpp-ruby
            modules: nutshell-cpp,nutshell-ruby
            count: 20
          - name: php-swift
            modules: nutshell-php,nutshell-swift
            count: 20
          - name: terminal
            modules: nutshell-terminal
            count: 10
    runs-on: ubuntu-latest
    timeout-minutes: 480
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure git identity
        run: |
          git config user.name "farang-dev"
          git config user.email "farang-dev@users.noreply.github.com"
      - name: Run OpenCode - generate nutshell ${{ matrix.batch.name }}
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          use_github_token: true
          prompt: |
            You are an expert software engineering educator. Your task: fill in the content for ALL topics in these Nutshell modules in src/data/curriculum.ts. Do NOT touch any other module, domain, or file.

            ## Target Modules (batch: ${{ matrix.batch.name }})
            Module IDs: ${{ matrix.batch.modules }}
            Total topics: ${{ matrix.batch.count }}

            Every topic currently has content: "", keyPoints: [], tags: [], readTimeMin: 0. For each topic:
            1. Write a comprehensive Nutshell-style article in the `content` field.
            2. Fill `keyPoints` with 4-6 essential learning points.
            3. Fill `tags` with 2-4 relevant tag strings.
            4. Set `readTimeMin` to an appropriate value (5-25 depending on depth).

            ## Nutshell Style Guide
            Nutshell is **a beginner's complete map** — not a tutorial, not a reference, but a beautifully organized guide that builds understanding from zero. The name says it all: everything you need to know about this topic, in a nutshell.

            Every topic MUST follow this exact structure:

            ### 1. ## What's This?
            One short paragraph. Define in plain language, give a real-world analogy, state why it exists. No more than 4-5 sentences.

            ### 2. ## The Big Picture
            Show how this topic fits into the broader language/ecosystem. What concepts does it build on? What comes next? Connect the dots so the reader sees the map, not just one dot.

            ### 3. ## Core Ideas
            Break into progressive ### subsections. For each idea:
            - Explain it in plain language first (one paragraph)
            - Show a short code snippet
            - Explain what the code does (one line per comment in code, no separate prose explanation needed)
            Use tables to compare variants or summarize.

            ### 4. ## Wiring It Together
            One complete, realistic example that connects all the core ideas. Every line commented. Show the "happy path" end-to-end.

            ## RULES
            1. Zero gaps — explain every term, every symbol, every concept from scratch. If the reader needs to know X to understand this topic, define X briefly.
            2. Write for someone who has never seen this concept — analogies over jargon.
            3. Dense but clear — every sentence carries information. No filler, no repetition.
            4. Every concept gets a code snippet. Every code line gets a comment.
            5. Use <code> tags for inline code (NOT backticks).
            6. Escape dollar-brace as backslash-dollar-brace inside template literals.
            7. Preserve id, title, shortDesc, difficulty — ONLY replace content, keyPoints, tags, readTimeMin.
            8. After ALL edits, run: npx tsc -p tsconfig.app.json --noEmit — fix any errors.
            9. Write in English, no emojis.

            ## Module-by-module topic list

            ${{ matrix.batch.name == 'python-js' && '### nutshell-python (11 topics)
            1. ns-py-syntax — Syntax & Basics
            2. ns-py-data-types — Data Types & Structures
