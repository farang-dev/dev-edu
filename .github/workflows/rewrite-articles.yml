name: Expand All Articles
on:
  workflow_dispatch:
jobs:
  expand:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure git identity
        run: |
          git config user.name "farang-dev"
          git config user.email "farang-dev@users.noreply.github.com"
      - name: Run OpenCode - expand all articles
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          use_github_token: true
          prompt: |
            You are an expert software engineering educator. Your task is to expand and enrich ALL 118 articles in src/data/curriculum.ts by adding explanations of technical terms.

            ## What to fix
            The current articles use technical terms (like "CSSOM", "JIT", "TLS", "sharding", "CRP", "backpressure", etc.) without defining them. Beginners cannot understand them.

            For EVERY topic in the file, find its content field and:

            1. **Define every term on first use** - When a specialized term appears, add a parenthetical definition: e.g. "CRP (Critical Rendering Path, the browser pipeline that converts HTML/CSS to pixels)"
            2. **Add beginner context** - Before dense sections, add 1-2 sentences relating the concept to something familiar
            3. **Expand code comments** - Add // comments inside code blocks explaining each line
            4. **Add a Common Pitfalls section** - 3-5 real mistakes developers make
            5. **Add more Practice Questions** - target 8+ total per topic

            ## Rules
            KEEP all existing text. Only ADD new content. Do NOT delete anything.
            Preserve id, title, shortDesc, difficulty, readTimeMin, keyPoints, codeExample, tags as-is.
            Use <code> tags for inline code (not backticks).
            Escape dollar-brace as backslash-dollar-brace.
            After all edits, run: npx tsc -p tsconfig.app.json --noEmit.
            Only edit curriculum.ts. Write in English, no emojis.
