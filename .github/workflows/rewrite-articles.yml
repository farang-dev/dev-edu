name: Expand All Articles
on:
  workflow_dispatch:
jobs:
  expand:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure git identity
        run: |
          git config user.name "farang-dev"
          git config user.email "farang-dev@users.noreply.github.com"
      - name: Run OpenCode - expand all articles
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          use_github_token: true
          prompt: |
            You are an expert software engineering educator. Your task is to expand and enrich ALL 118 articles in src/data/curriculum.ts. This is a comprehensive educational content improvement pass.

            ## Current State
            The file contains 118 topics across 4 domains:
            - be-* (Backend, 34 topics) — avg ~6,500 chars each
            - infra-* (Infrastructure, 22 topics) — avg ~5,800 chars each
            - do-* (DevOps, 26 topics) — avg ~6,200 chars each
            - fe-* (Frontend, 36 topics) — avg ~8,500 chars each

            Each topic has fields: id, title, shortDesc, difficulty, readTimeMin, keyPoints, content, codeExample (optional), tags.

            ## What To Do
            For EVERY topic, find its `content:` field and EDIT it (add to existing content, never delete). Follow these rules:

            1. **Explain every technical term on first use** — If an article uses "CRP", "CSSOM", "JIT", "TLS", "sharding", or ANY specialized term, immediately follow it with a parenthetical definition: e.g., "CRP (Critical Rendering Path — the 6-step pipeline the browser uses to convert HTML/CSS/JS into pixels)".
            
            2. **Add beginner context** — Before jumping into technical detail, add a paragraph that tells a beginner what this concept is analogous to in the real world.

            3. **Expand code examples** — For every code block, add explanatory comments and at least 2-3 sentences afterward explaining what the code does and why it works.

            4. **Add edge cases and footguns** — After explaining the main concept, add a "## Common Pitfalls" section with 3-5 real-world mistakes developers make.

            5. **Expand Practice Questions** — Add at least 3 more scenario-based practice questions (total 8+). Each question should test conceptual understanding, not memorization.

            6. **Add cross-references** — When an article mentions a concept covered in another topic, add a note like "(see also: fe-event-loop for more on microtasks)".

            7. **Target minimum 20,000 characters** per `content:` field (currently 7k avg).

            ## How To Edit (CRITICAL)
            - Do NOT delete or replace existing content. KEEP ALL existing text and ADD new text around it.
            - Insert term definitions inline within existing paragraphs when terms first appear.
            - Insert new sections (like "## Common Pitfalls", "## Further Reading") at the END of the existing content, before the closing backtick.
            - Keep the existing `id`, `title`, `shortDesc`, `difficulty`, `readTimeMin`, `keyPoints`, `codeExample`, `tags` fields UNCHANGED.
            
            ## Processing Order
            Work through topics in file order within each domain. Process ALL 4 domains:
            1. Backend (be-*)
            2. Infrastructure (infra-*)
            3. DevOps (do-*)
            4. Frontend (fe-*)

            ## Inline Code Rules
            - Inside template literal content (`content: \`...\``), use <code> tags instead of backticks for inline code.
            - Write ${...} as \${...} and ${{...}} as $\{{...}} inside template literals.

            ## Verification
            After all edits, run: npx tsc -p tsconfig.app.json --noEmit — fix any errors. Do NOT create new files — only edit curriculum.ts. Write in English, no emojis.
